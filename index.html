<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Font cantik dan membulat dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .gif-container {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.5rem;
            background-color: #fff0f5;
            padding: 10px 25px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
        }

        .buttons {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        #btn-saya {
            background-color: #ff69b4;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            white-space: nowrap;
        }

        #btn-saya:hover {
            background-color: #ff1493;
        }

        #btn-bukan {
            background-color: #f0f0f0;
            color: #777;
            padding: 12px 24px;
            font-size: 16px;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="gif-container">
            <div class="tenor-gif-embed" data-postid="14039433467847577032" data-share-method="host"
                data-aspect-ratio="1" data-width="100%">
                <a href="https://tenor.com/view/bubu-gif-14039433467847577032">Bubu Sticker</a>from
                <a href="https://tenor.com/search/bubu-stickers">Bubu Stickers</a>
            </div>
            <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        </div>

        <h1>Siapa yang ulang tahun hari ini?</h1>

        <div class="buttons">
            <button id="btn-saya">Saya</button>
            <button id="btn-bukan">Bukan saya</button>
        </div>
    </div>

    <script>
        // --- BAGIAN BARU: RESET SEMUA IZIN SAAT MULAI DARI AWAL ---
        sessionStorage.clear();
        // ----------------------------------------------------------

        const btnSaya = document.getElementById('btn-saya');
        const btnBukan = document.getElementById('btn-bukan');

        let btnSayaSize = 16;
        let btnSayaPaddingV = 12;
        let btnSayaPaddingH = 24;

        btnBukan.addEventListener('click', () => {
            const currentSize = parseFloat(window.getComputedStyle(btnBukan).fontSize);
            const newSize = currentSize * 0.8;
            btnBukan.style.fontSize = `${newSize}px`;
            btnBukan.style.padding = `${newSize * 0.75}px ${newSize * 1.5}px`;

            btnSayaSize += 15;
            btnSayaPaddingV += 10;
            btnSayaPaddingH += 20;

            btnSaya.style.fontSize = `${btnSayaSize}px`;
            btnSaya.style.padding = `${btnSayaPaddingV}px ${btnSayaPaddingH}px`;
        });

        btnSaya.addEventListener('click', () => {
            // --- BAGIAN BARU: MEMBERIKAN IZIN UNTUK KE NEXT1.HTML ---
            sessionStorage.setItem('izin_next1', 'true');
            // --------------------------------------------------------
            window.location.href = 'next1.html';
        });
    </script>

</body>

</html>
