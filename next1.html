<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanggal Berapa?</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .gif-container {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.5rem;
            background-color: #fff0f5;
            padding: 12px 30px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
        }

        .buttons {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 50px;
        }

        button {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            padding: 12px 24px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
            white-space: nowrap;
            transition: opacity 0.5s ease, transform 0.5s ease, background-color 0.2s ease;
        }

        .btn-choice {
            background-color: #ff69b4;
            color: white;
        }

        .btn-choice:hover {
            background-color: #ff1493;
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            pointer-events: none;
        }

        /* --- STYLING UNTUK POP-UP ANTI-CURANG --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            /* Sengaja dibuat putih pekat menutupi seluruh layar */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content p {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
        }

        .btn-oke {
            background-color: #ff69b4;
            color: white;
        }

        .btn-oke:hover {
            background-color: #ff1493;
        }
    </style>
</head>

<body>

    <!-- --- ELEMEN POP-UP ANTI-CURANG --- -->
    <div id="cheat-alert" class="modal-overlay">
        <div class="modal-content">
            <div class="gif-container" style="margin-bottom: 0;">
                <div class="tenor-gif-embed" data-postid="3054031450086877982" data-share-method="host"
                    data-aspect-ratio="1" data-width="100%">
                    <a href="https://tenor.com/view/bubu-dudu-sseeyall-gif-3054031450086877982">Bubu Dudu Sseeyall
                        Sticker</a>from
                    <a href="https://tenor.com/search/bubu+dudu-stickers">Bubu Dudu Stickers</a>
                </div>
            </div>
            <p>Harus berurutan dari awal ya sayangg</p>
            <button id="btn-back" class="btn-oke">Oke</button>
        </div>
    </div>

    <!-- Konten Utama -->
    <div class="container" id="main-content" style="display: none;">
        <div class="gif-container">
            <div class="tenor-gif-embed" data-postid="3603040055391355358" data-share-method="host"
                data-aspect-ratio="1" data-width="100%">
                <a href="https://tenor.com/view/bu-bu-gif-3603040055391355358">Bu Bu Sticker</a>from
                <a href="https://tenor.com/search/bu+bu-stickers">Bu Bu Stickers</a>
            </div>
        </div>

        <h1>Hari ini tanggal berapa ya??</h1>

        <div class="buttons">
            <button id="btn-target" class="btn-choice">15 Agustus 2026</button>
            <button id="btn-today" class="btn-choice">Memuat...</button>
        </div>
    </div>

    <!-- Script Tenor dipanggil satu kali saja -->
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <!-- Script Logika -->
    <script>
        // --- LOGIKA ANTI-CURANG ---
        // Cek apakah dia punya izin dari index.html
        if (!sessionStorage.getItem('izin_next1')) {
            // Kalau gak punya, munculkan pop up dan jangan tampilkan konten
            document.getElementById('cheat-alert').classList.add('show');

            document.getElementById('btn-back').addEventListener('click', () => {
                window.location.href = 'index.html'; // Usir balik ke index
            });
        } else {
            // Kalau punya izin, tampilkan konten halaman
            document.getElementById('main-content').style.display = 'flex';

            // --- LOGIKA NORMAL HALAMAN NEXT1 ---
            const btnTarget = document.getElementById('btn-target');
            const btnToday = document.getElementById('btn-today');

            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const hariIni = new Date().toLocaleDateString('id-ID', options);
            btnToday.textContent = hariIni;

            btnToday.addEventListener('click', () => {
                btnToday.classList.add('fade-out');
                setTimeout(() => {
                    btnToday.style.display = 'none';
                }, 500);
            });

            btnTarget.addEventListener('click', () => {
                // Beri izin untuk ke halaman next2.html
                sessionStorage.setItem('izin_next2', 'true');
                window.location.href = 'next2.html';
            });
        }
    </script>

</body>

</html>
