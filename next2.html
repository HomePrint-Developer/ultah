<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buka Kadonya!</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            flex-direction: column;
        }

        /* --- STYLING UNTUK POP-UP ANTI-CURANG --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            /* Putih pekat untuk menutupi konten */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content p {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
        }

        .btn-oke {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .btn-oke:hover {
            background-color: #ff1493;
        }

        .gif-container-popup {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 0;
        }

        /* -------------------------------------- */

        /* Konten Utama */
        #main-content {
            display: none;
            /* Sembunyikan default, dimunculkan via JS jika aman */
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.8rem;
            background-color: #fff0f5;
            padding: 12px 30px;
            border-radius: 30px;
            margin-bottom: 50px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
            z-index: 10;
        }

        .gift-container {
            font-size: 120px;
            color: #ff69b4;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: transform 0.2s;
            filter: drop-shadow(0 10px 15px rgba(255, 105, 180, 0.3));
        }

        .gift-container:hover {
            transform: scale(1.1);
        }

        @keyframes shake {
            0% {
                transform: scale(1.1) rotate(0deg);
            }

            25% {
                transform: scale(1.1) rotate(-15deg);
            }

            50% {
                transform: scale(1.1) rotate(15deg);
            }

            75% {
                transform: scale(1.1) rotate(-15deg);
            }

            100% {
                transform: scale(1.1) rotate(0deg);
            }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- --- ELEMEN POP-UP ANTI-CURANG --- -->
    <div id="cheat-alert" class="modal-overlay">
        <div class="modal-content">
            <div class="gif-container-popup">
                <div class="tenor-gif-embed" data-postid="3054031450086877982" data-share-method="host"
                    data-aspect-ratio="1" data-width="100%">
                    <a href="https://tenor.com/view/bubu-dudu-sseeyall-gif-3054031450086877982">Bubu Dudu Sseeyall
                        Sticker</a>from
                    <a href="https://tenor.com/search/bubu+dudu-stickers">Bubu Dudu Stickers</a>
                </div>
            </div>
            <p>Harus berurutan dari awal ya sayangg</p>
            <button id="btn-back" class="btn-oke">Oke</button>
        </div>
    </div>

    <!-- Konten Utama Halaman -->
    <div id="main-content">
        <h1>Klik kado ini</h1>

        <!-- Icon Kado -->
        <div class="gift-container" id="gift-box">
            <i class="fa-solid fa-gift"></i>
        </div>
    </div>

    <!-- Script Tenor dipanggil satu kali saja -->
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <script>
        // --- LOGIKA ANTI-CURANG ---
        // Cek apakah dia punya izin dari next1.html
        if (!sessionStorage.getItem('izin_next2')) {
            document.getElementById('cheat-alert').classList.add('show');
            document.getElementById('btn-back').addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        } else {
            // Jika punya izin, tampilkan konten utama
            document.getElementById('main-content').style.display = 'flex';

            // --- LOGIKA NORMAL HALAMAN NEXT2 ---
            const giftBox = document.getElementById('gift-box');
            let clickCount = 0;
            const maxClicks = 10;

            const icons = ['fa-star', 'fa-heart'];
            const colors = ['#ff69b4', '#ff1493', '#ffd700', '#00bfff', '#9370db', '#ff4500'];

            giftBox.addEventListener('click', (e) => {
                clickCount++;

                giftBox.classList.remove('shake-animation');
                void giftBox.offsetWidth;
                giftBox.classList.add('shake-animation');

                createParticles();

                if (clickCount >= maxClicks) {
                    // Beri izin untuk ke halaman next3.html
                    sessionStorage.setItem('izin_next3', 'true');

                    setTimeout(() => {
                        window.location.href = 'next3.html';
                    }, 600);
                }
            });

            function createParticles() {
                const rect = giftBox.getBoundingClientRect();
                const centerX = rect.left + (rect.width / 2);
                const centerY = rect.top + (rect.height / 2);

                const particleCount = 15;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('i');
                    const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];

                    particle.classList.add('fa-solid', randomIcon, 'particle');
                    particle.style.color = randomColor;
                    particle.style.left = `${centerX}px`;
                    particle.style.top = `${centerY}px`;

                    document.body.appendChild(particle);

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 150 + 50;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;

                    const animation = particle.animate([
                        { transform: `translate(-50%, -50%) scale(0.5) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                    ], {
                        duration: 600 + Math.random() * 400,
                        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                        fill: 'forwards'
                    });

                    animation.onfinish = () => {
                        particle.remove();
                    };
                }
            }
        }
    </script>

</body>

</html>
