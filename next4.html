    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* --- STYLING UNTUK POP-UP ANTI-CURANG --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content p {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
        }

        .btn-oke {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .btn-oke:hover {
            background-color: #ff1493;
        }

        .gif-container-popup {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 0;
        }

        /* -------------------------------------- */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .gif-container {
            width: 220px;
            max-width: 100%;

        }

        h1 {
            color: #ff69b4;
            font-size: 1.8rem;
            background-color: #fff0f5;
            padding: 15px 40px;
            border-radius: 30px;
            margin-bottom: 0;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
