<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* --- STYLING UNTUK POP-UP ANTI-CURANG --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content p {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
        }

        .btn-oke {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .btn-oke:hover {
            background-color: #ff1493;
        }

        .gif-container-popup {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 0;
        }

        /* -------------------------------------- */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            z-index: 10;
        }

        .gif-container {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 20px;
        }

        .message-box {
            background-color: #fff0f5;
            padding: 20px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            align-items: center;
        }

        #typewriter-text {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: left;
            border-right: 2px solid #ff69b4;
            padding-right: 5px;
            animation: blinkCursor 0.75s step-end infinite;
        }

        @keyframes blinkCursor {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: #ff69b4;
            }
        }

        #btn-lanjut {
            display: none;
            opacity: 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            padding: 12px 35px;
            font-size: 18px;
            background-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #btn-lanjut:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        .fade-in {
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- --- ELEMEN POP-UP ANTI-CURANG --- -->
    <div id="cheat-alert" class="modal-overlay">
        <div class="modal-content">
            <div class="gif-container-popup">
                <div class="tenor-gif-embed" data-postid="3054031450086877982" data-share-method="host"
                    data-aspect-ratio="1" data-width="100%">
                    <a href="https://tenor.com/view/bubu-dudu-sseeyall-gif-3054031450086877982">Bubu Dudu Sseeyall
                        Sticker</a>from
                    <a href="https://tenor.com/search/bubu+dudu-stickers">Bubu Dudu Stickers</a>
                </div>
            </div>
            <p>Harus berurutan dari awal ya sayangg</p>
            <button id="btn-back" class="btn-oke">Oke</button>
        </div>
    </div>

    <!-- Konten Utama (Disembunyikan di awal) -->
    <div class="container" id="main-content" style="display: none;">
        <div class="gif-container">
            <div class="tenor-gif-embed" data-postid="1717058613202827061" data-share-method="host"
                data-aspect-ratio="1" data-width="100%">
                <a href="https://tenor.com/view/bubu-bubu-dudu-dudu-bear-karadi-gif-1717058613202827061">Bubu Bubu Dudu
                    Sticker</a>from
                <a href="https://tenor.com/search/bubu-stickers">Bubu Stickers</a>
            </div>
        </div>

        <div class="message-box">
            <div id="typewriter-text"></div>
        </div>

        <button id="btn-lanjut">Lanjut ➔</button>
    </div>

    <!-- Script Tenor dipanggil satu kali -->
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <!-- Script Logika -->
    <script>
        // Cek apakah dia punya izin dari next4.html
        if (!sessionStorage.getItem('izin_next5')) {
            document.getElementById('cheat-alert').classList.add('show');
            document.getElementById('btn-back').addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        } else {
            // Tampilkan konten
            document.getElementById('main-content').style.display = 'flex';

            const textToType = "Siapa sih yang nggak kenal sama sosok ini? Kamu yang selalu jadi sandaran terkuat saat aku merasa paling lemah. Iya, kamu yang lagi nyengir itu. Maaf kalau ucapannya telat, tapi aku nggak pernah bisa melupakan hari spesial ketika kamu hadir di dunia. Kalau dipikir-pikir, mungkin kamu yang sering lupa ulang tahunku, padahal siapa sih yang bisa lupa tanggal lahir pasangannya? Hadiah menyusul yaaa";

            const speed = 100;
            let i = 0;
            const typeWriterElement = document.getElementById("typewriter-text");
            const btnLanjut = document.getElementById("btn-lanjut");

            function typeWriter() {
                if (i < textToType.length) {
                    typeWriterElement.innerHTML += textToType.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                } else {
                    typeWriterElement.style.borderRight = "none";
                    btnLanjut.style.display = "inline-block";
                    setTimeout(() => {
                        btnLanjut.classList.add("fade-in");
                    }, 100);
                }
            }

            // Jalankan efek saat halaman dimuat (jeda 1 detik)
            setTimeout(typeWriter, 1000);

            btnLanjut.addEventListener("click", () => {
                // Beri izin untuk ke halaman next6.html
                sessionStorage.setItem('izin_next6', 'true');
                window.location.href = "next6.html";
            });
        }
    </script>

</body>

</html>
