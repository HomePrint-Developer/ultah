    <style>
        body {
            background-color: #ffffff;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;

        }

        /* --- STYLING UNTUK POP-UP ANTI-CURANG --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 25px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-content p {
            color: #4a4a4a;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 15px 0 20px 0;
        }

        .btn-oke {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
        }

        .btn-oke:hover {
            background-color: #ff1493;
        }

        .gif-container-popup {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 0;
        }

        /* -------------------------------------- */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            z-index: 10;
        }

        .gif-container {
            width: 220px;
            max-width: 100%;
            pointer-events: none;
            margin-bottom: 20px;
        }

        .message-box {
            background-color: #fff0f5;
            padding: 20px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.15);
            margin-bottom: 30px;
            min-height: 250px;
            display: flex;
            align-items: flex-start;
        }

        #typewriter-text {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: left;
            border-right: 2px solid #ff69b4;
            padding-right: 5px;
            animation: blinkCursor 0.75s step-end infinite;
        }

        @keyframes blinkCursor {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: #ff69b4;
            }
        }

        #btn-kirim {
            display: none;
            opacity: 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: bold;
            padding: 12px 35px;
            font-size: 18px;
            background-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #btn-kirim:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        .fade-in {
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Script Logika -->
    <script>
        // Cek apakah dia punya izin dari next5.html
        if (!sessionStorage.getItem('izin_next6')) {
            document.getElementById('cheat-alert').classList.add('show');
            document.getElementById('btn-back').addEventListener('click', () => {
                window.location.href = 'index.html';
            });
        } else {
            // Tampilkan konten
            document.getElementById('main-content').style.display = 'flex';

            const textToType = "Selamat ulang tahun, cintaku. Hari ini bukan hanya tentang bertambahnya usiamu, tapi juga tentang betapa berartinya kehadiranmu dalam hidupku. Kamu adalah alasan aku tersenyum setiap pagi, semangatku di saat lelah, dan pelengkap yang membuat hidupku terasa utuh. Semoga semua impianmu tercapai, langkahmu selalu dimudahkan, dan kebahagiaan senantiasa menyertai setiap harimu. Terima kasih sudah menjadi bagian terindah dalam hidupku, aku berjanji akan selalu ada untukmu, mendukungmu, dan mencintaimu lebih dari kemarin.";

            const speed = 100;
            let i = 0;
            const typeWriterElement = document.getElementById("typewriter-text");
            const btnKirim = document.getElementById("btn-kirim");

            function typeWriter() {
                if (i < textToType.length) {
                    typeWriterElement.innerHTML += textToType.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                } else {
                    typeWriterElement.style.borderRight = "none";
                    btnKirim.style.display = "inline-block";
                    setTimeout(() => {
                        btnKirim.classList.add("fade-in");
                    }, 100);
                }
            }

            // Jalankan efek saat halaman dimuat
            setTimeout(typeWriter, 1000);

            btnKirim.addEventListener("click", () => {
                // Beri izin untuk ke halaman end.html
                sessionStorage.setItem('izin_end', 'true');
                window.location.href = "end.html";
            });
        }
    </script>
